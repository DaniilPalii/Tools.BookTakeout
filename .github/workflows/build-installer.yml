name: Build & Release Installer

on:
  push:
    paths:
      - 'Directory.Build.props'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version_changed: ${{ steps.check.outputs.changed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check if Version changed
        id: check
        run: |
          CURRENT=$(sed -n 's:.*<InformationalVersion>\(.*\)</InformationalVersion>.*:\1:p' Directory.Build.props || true)
          PREV=$(git show HEAD~1:Directory.Build.props 2>/dev/null | sed -n 's:.*<InformationalVersion>\(.*\)</InformationalVersion>.*:\1:p' || true)
          if [ "${CURRENT}" != "${PREV}" ]; then echo "changed=true" >> $GITHUB_OUTPUT; else echo "changed=false" >> $GITHUB_OUTPUT; fi

  build:
    needs: check-version
    if: needs.check-version.outputs.version_changed == 'true' || startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore

      - name: Build Application
        run: dotnet build --configuration Release --no-restore

      - name: Publish Application
        run: dotnet publish --self-contained -r win-x64

      - name: Compile Inno Setup Script
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: ./setup/BookTakeout.Console.iss

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./artifacts/setup/BookTakeout_v*.exe
          generate_release_notes: true